<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hgl_order_sheet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hgl_order_sheet</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 以前のビルドで登録された Service Worker（PWAキャッシュ）を解除する。
    // 新しいビルドは Service Worker を登録しないが、既にインストール済みの
    // 端末では解除しない限りキャッシュが残り続け、更新が反映されないため
    // 一度だけ後始末する。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>

  <!-- LINE Front-end Framework (LIFF) SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // Dart 側 (lib/services/liff_service.dart) から dart:js_interop 経由で
    // window.liffBridge.init(liffId) を呼び出す薄いブリッジ。
    window.liffBridge = {
      ready: false,
      loggedIn: false,
      userId: null,
      displayName: null,
      pictureUrl: null,
      errorMessage: null,
      init: function (liffId) {
        return liff.init({ liffId: liffId }).then(function () {
          window.liffBridge.ready = true;
          window.liffBridge.loggedIn = liff.isLoggedIn();
          if (!window.liffBridge.loggedIn) {
            liff.login();
            return false;
          }
          return liff.getProfile().then(function (profile) {
            window.liffBridge.userId = profile.userId;
            window.liffBridge.displayName = profile.displayName || null;
            window.liffBridge.pictureUrl = profile.pictureUrl || null;
            return true;
          });
        }).catch(function (err) {
          window.liffBridge.errorMessage = (err && err.message) ? err.message : String(err);
          return false;
        });
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
